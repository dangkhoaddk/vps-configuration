# configuration file /etc/nginx/conf.d/admin-ssl.conf:
upstream admin_frontend {
    server spa-admin:5001; # Points to the spa-admin container
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.balispacafe.com www.admin.balispacafe.com;

    ssl_certificate /etc/letsencrypt/live/admin.balispacafe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.balispacafe.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# configuration file /etc/nginx/conf.d/api-ssl.conf:
server {
    listen 443 ssl;
    http2 on; # New way to enable HTTP/2
    server_name api.balispacafe.com www.api.balispacafe.com;

    ssl_certificate /etc/letsencrypt/live/api.balispacafe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.balispacafe.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Wildcard so nginx still starts if the snippet has not been written yet.
    include /etc/nginx/snippets/monitor*.conf;

    location / {
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=global_limit burst=20 nodelay;
    }
}

# configuration file /etc/nginx/snippets/monitor.conf:
# Netdata dashboard for this VPS, reverse-proxied under /monitor/.
# Subfolder pattern from Netdata's nginx reverse-proxy documentation: the
# dashboard serves from its own root, so the path is stripped via $ndpath
# before being passed upstream.
location = /monitor {
    return 301 /monitor/;
}

location ~ /monitor/(?<ndpath>.*) {
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_pass_request_headers on;
    proxy_set_header Connection "keep-alive";
    proxy_store off;
    proxy_pass http://netdata/$ndpath$is_args$args;

    gzip on;
    gzip_proxied any;
    gzip_types *;
}

# configuration file /etc/nginx/conf.d/http.conf:
server {
    listen 80;
    server_name api.balispacafe.com www.api.balispacafe.com balispacafe.com www.balispacafe.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# configuration file /etc/nginx/conf.d/upstreams.conf:
# --- 1. Rate Limiting Definitions ---
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=2r/m;

# --- 2. Optimized Timeouts ---
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;
client_max_body_size 1M;

upstream nestjs_backend {
    # CRITICAL: Change 127.0.0.1 to your docker service name (e.g., 'api')
    server spa-api:3000; # Points to your NestJS app
}

upstream netdata {
    server monitor:19999; # Netdata agent container from docker-compose.sa.yml
    keepalive 64;
}

# NOTE: nginx resolves every upstream hostname at config-load time, even for
# upstreams no server block references. Only define upstreams whose containers
# are actually running on ext_network, otherwise nginx fails to start (no
# /run/nginx.pid) and the later  errors. Re-add nextjs_frontend
# (spa-web) / admin_frontend (spa-admin) here once those services are deployed.


# configuration file /etc/nginx/conf.d/web-ssl.conf:
upstream web_frontend_ver2 {
    server bali-spa-cafe:3000; # Points to the bali-spa-cafe container
}

server {
    listen 443 ssl;
    http2 on;
    server_name balispacafe.com www.balispacafe.com;

    ssl_certificate /etc/letsencrypt/live/balispacafe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balispacafe.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 5m;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Netdata VPS dashboard at /monitor/. The snippet and its netdata upstream
    # are written by spa-api/tool/deploy.sh; the wildcard keeps nginx starting
    # when only the web stack has been deployed.
    include /etc/nginx/snippets/monitor*.conf;

    location / {
        proxy_pass http://web_frontend_ver2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

