upstream web_frontend_ver2 {
    server bali-spa-cafe:3000; # Points to the bali-spa-cafe container
}

server {
    listen 443 ssl;
    http2 on;
    server_name balispacafe.com www.balispacafe.com;

    ssl_certificate /etc/letsencrypt/live/balispacafe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/balispacafe.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 5m;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Netdata VPS dashboard at /monitor/. The snippet and its netdata upstream
    # are written by spa-api/tool/deploy.sh; the wildcard keeps nginx starting
    # when only the web stack has been deployed.
    include /etc/nginx/snippets/monitor*.conf;

    location / {
        proxy_pass http://web_frontend_ver2;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
