server {
    listen 443 ssl;
    http2 on; # New way to enable HTTP/2
    server_name api.balispacafe.com www.api.balispacafe.com;

    ssl_certificate /etc/letsencrypt/live/api.balispacafe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.balispacafe.com/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Wildcard so nginx still starts if the snippet has not been written yet.
    include /etc/nginx/snippets/monitor*.conf;

    location / {
        proxy_pass http://nestjs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        limit_req zone=global_limit burst=20 nodelay;
    }
}
