name: CI

# The parity gate. Changing what production serves requires updating
# baseline/ in the same pull request, which turns every routing change into a
# reviewable diff. That property is most of the point of this repo.

on:
  pull_request:
  push:
    branches: [main]

# Actions are pinned to commit SHAs, not tags. A tag is mutable, and this
# workflow gates changes to production TLS termination.
env:
  # apps.yml resolves these at load time. Nothing in CI reads or writes the
  # paths themselves: rendering is pure, and the validator mounts its own
  # scratch tree. Placeholders are therefore correct rather than lazy.
  NGINX_CONF_DIR: /nonexistent/conf
  SNIPPETS_DIR: /nonexistent/snippets
  CERTS_ROOT: /nonexistent/certbot
  ACME_EMAIL: ci@example.invalid

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Ordered cheapest first: a type error should not wait on docker.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Includes the parity gate: rendered config must match baseline/.
      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      # Real nginx, in a container, over the rendered config. Upstream hostnames
      # and TLS certificates are both resolved at parse time, so the validator
      # fakes them; see src/nginx/validate-config.ts.
      - name: nginx -t
        run: node dist/cli.js validate

      # apps.yml is committed, so it must never carry credentials.
      - name: No secrets in the registry
        run: |
          if grep -nEi 'BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|aws_secret|password[[:space:]]*[:=]' apps.yml; then
            echo "::error file=apps.yml::possible credential in a committed file"
            exit 1
          fi
          echo "apps.yml is clean"
