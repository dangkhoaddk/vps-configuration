name: Deploy edge config

# Applies routing changes made in THIS repo: edits to apps.yml, the templates,
# or the edge compose file.
#
# App deploys do not go through here. Each app's own pipeline already has an SSH
# session on the VPS, so after starting its container it calls
# `./bin/vpsctl apply --app <name>` directly. That avoids a cross-repo dispatch
# and the personal access token it would need in all three app repos.
#
# Serialisation is not this workflow's job either. vpsctl takes a filesystem
# lock on the VPS, which also covers app pipelines and operators running it by
# hand. A concurrency group here would only order this repo's own runs.

# Runs AFTER CI, never beside it.
#
# This used to trigger on `push` to main, the same event as CI. Two workflows,
# no ordering between them, so the deploy raced the image build and usually won:
# on 2026-09-25 the deploy finished at 07:45:01 and `build-and-push` did not
# publish until 07:45:30. The VPS pulled an image 29 seconds before the new one
# existed, and ran a `vpsctl` that predated the commit being deployed. Both jobs
# reported success, because neither was wrong about its own work.
#
# `workflow_run` is the only way to order two workflows: `needs` works within a
# workflow, not across them. CI's last job pushes the image, so waiting for CI
# to complete is waiting for the image.
#
# The `paths` filter is gone with it. It listed apps.yml, templates, src and the
# compose file, which silently excluded `bin/vpsctl` — the script every deploy
# runs. Rather than maintain a list that is wrong when someone forgets it, apply
# on every successful CI run: with no `--app`, an unchanged config renders, tests
# clean, writes nothing and does not reload. A docs-only push costs one no-op.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      app:
        description: "Limit to one app (blank applies all)"
        required: false
        type: string

# Belt and braces alongside vpsctl's own lock: no reason to have two runs of
# this workflow racing to git pull the same checkout. Never cancel in progress,
# since interrupting a half-applied config is worse than queueing.
concurrency:
  group: vps-edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # CI also runs on pull_request, and workflow_run fires for those too. Deploy
    # only for a push to main that actually passed, so a green PR check never
    # reaches production and a failed build-and-push never gets applied on top of
    # an image that was not published.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    environment: prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APP_INPUT: ${{ inputs.app }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Apply on the VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The app input reaches the script as an environment variable, never by
          # template interpolation. Interpolating it would splice attacker-chosen
          # text into a shell script that runs on the VPS as the deploy user.
          #
          # GHCR_TOKEN carries this job's own ephemeral GITHUB_TOKEN in for the
          # docker login below. It's scoped to this workflow run and never
          # persisted on the VPS, matching how spa-api's and spa-web's deploy
          # pipelines authenticate their own VPS-side `docker login`/`compose pull`.
          envs: APP_INPUT,GHCR_TOKEN
          script: |
            set -eu

            REPO_DIR="$HOME/vps-configuration"

            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "$REPO_DIR is not a checkout of this repo. Clone it first." >&2
              exit 1
            fi

            cd "$REPO_DIR"
            git fetch origin
            # main HEAD, not the SHA that triggered this run. If a second push
            # lands while this one is in flight, the checkout is the newer commit
            # and the image may still be the older build. That window closes on
            # its own when the second push's own deploy runs, and the concurrency
            # group above keeps the two from interleaving. Pinning the SHA
            # instead would leave the VPS on a detached HEAD, which the app
            # pipelines' `git pull --ff-only origin main` cannot recover from.
            git reset --hard origin/main

            # Constrain the input before it becomes an argument. App names are
            # lowercase letters, digits and dashes; anything else is rejected
            # rather than passed along.
            if [ -n "${APP_INPUT:-}" ]; then
              case "$APP_INPUT" in
                *[!a-z0-9-]*) echo "Invalid app name: $APP_INPUT" >&2; exit 1 ;;
              esac
              set -- --app "$APP_INPUT"
            else
              set --
            fi

            # vps-configuration is a private GHCR package, so bin/vpsctl's plain
            # `docker pull` needs an authenticated session first. This uses the
            # job's own ephemeral GITHUB_TOKEN and is never persisted on the VPS.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # bin/vpsctl pulls its own image from GHCR on every run, so a
            # plain checkout is enough here — no local build step.
            #
            # Dry run first, so the run log records the diff even on success.
            ./bin/vpsctl apply "$@" --dry-run
            ./bin/vpsctl apply "$@"
